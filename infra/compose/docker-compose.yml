services:
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    ports:
      - "${NEO4J_BOLT_PORT:-7688}:7687"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      STEM_SCI_ENV: production
      STEM_SCI_CONFIG_STRICT: "true"
      STEM_SCI_CORS_ORIGINS: ${STEM_SCI_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      STEM_SCI_LLM_PROVIDER: ${STEM_SCI_LLM_PROVIDER:-gpt}
      STEM_SCI_LLM_BASE_URL: ${STEM_SCI_LLM_BASE_URL:-https://api.deepseek.com}
      STEM_SCI_LLM_MODEL: ${STEM_SCI_LLM_MODEL:-deepseek-chat}
      STEM_SCI_LLM_API_KEY: ${STEM_SCI_LLM_API_KEY:-}
      STEM_SCI_LLM_TIMEOUT_SECONDS: ${STEM_SCI_LLM_TIMEOUT_SECONDS:-60}
      STEM_SCI_MAX_LLM_CALLS: ${STEM_SCI_MAX_LLM_CALLS:-12}
      STEM_SCI_REPOSITORY_ROOT: /app
      STEM_SCI_STORAGE_DIR: /var/lib/stem-sci
      STEM_SCI_CONTEXT_PROVIDER: hybrid
      STEM_SCI_GRAPH_BACKEND: neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set}
      NEO4J_DATABASE: neo4j
      NEO4J_PROJECT_ID: ${NEO4J_PROJECT_ID:-stem-sci}
      STEM_SCI_VECTOR_KB_ROOT: /data/vector_kb
      STEM_SCI_PDF_ROOT: /data/literature_pdfs
    volumes:
      - ${VECTOR_KB_HOST_ROOT:?VECTOR_KB_HOST_ROOT must point to vector_kb}:/data/vector_kb:ro
      - ${PDF_ROOT_HOST_ROOT:?PDF_ROOT_HOST_ROOT must point to literature_pdfs}:/data/literature_pdfs:ro
      - stem_sci_storage:/var/lib/stem-sci
    ports:
      - "${STEM_SCI_BACKEND_PORT:-8000}:8000"

volumes:
  neo4j_data:
  neo4j_logs:
  stem_sci_storage:
