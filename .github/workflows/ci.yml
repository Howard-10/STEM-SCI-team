name: CI

on:
  push:
  pull_request:

jobs:
  backend-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install -e "./backend[dev]"
      - name: Ruff
        run: python -m ruff check backend/src backend/tests --isolated --target-version py311 --line-length 100 --select E4,E7,E9,F
      - name: Mypy
        run: python -m mypy backend/src/stem_sci/orchestration --config-file backend/pyproject.toml
      - name: Fast backend tests
        run: python -m pytest backend/tests -m "not slow"

  backend-slow:
    runs-on: ubuntu-latest
    needs: backend-fast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install project and development tools
        run: python -m pip install -e "./backend[dev]"
      - name: Full backend tests
        run: python -m pytest backend/tests -m slow

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck
        run: npm run typecheck --prefix frontend
      - name: Production build
        run: npm run build --prefix frontend
