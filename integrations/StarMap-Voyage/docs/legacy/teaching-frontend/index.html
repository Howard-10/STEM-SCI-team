<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>星图学航 2.0 - STEM自适应探究学习</title>
<link rel="stylesheet" href="./css/style.css?v=2"/>
</head>
<body>

<!-- ====== Left Sidebar ====== -->
<aside class="sidebar">
    <div class="sidebar-brand">
        <h1>星图学航</h1>
        <p>STEM自适应探究学习</p>
    </div>
    <nav class="sidebar-nav">
        <button class="nav-item active" data-page="home"> <span class="nav-icon">🏠</span> <span>首页探索</span> </button>
        <button class="nav-item" data-page="star-map"> <span class="nav-icon">🌟</span> <span>知识星图</span> </button>
        <button class="nav-item" data-page="achievement"> <span class="nav-icon">🏆</span> <span>成果展示墙</span> </button>
    </nav>
    <div class="sidebar-footer">星图学航 2.0 · 2026</div>
</aside>

<!-- ====== Main Content ====== -->
<div class="main-content">

    <!-- ====== HOME PAGE ====== -->
    <div id="home-page" class="page active">
        <div class="home-header">
            <h2>探索 STEM 项目</h2>
            <p>选择一个主题，开始你的探究学习之旅</p>
        </div>
        <div class="search-section">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="你想探索什么？比如：做一个自动感应门..." autocomplete="off"/>
                <button id="search-btn">探索</button>
            </div>
            <div class="search-filters">
                <select id="filter-grade">
                    <option value="">全部学段</option>
                    <option value="小学低段">小学低段</option>
                    <option value="小学中段">小学中段</option>
                    <option value="小学高段">小学高段</option>
                    <option value="初中" selected>初中</option>
                    <option value="高中">高中</option>
                </select>
                <select id="filter-difficulty">
                    <option value="0">全部难度</option>
                    <option value="1">⭐ 入门</option>
                    <option value="2">⭐⭐ 基础</option>
                    <option value="3">⭐⭐⭐ 进阶</option>
                    <option value="4">⭐⭐⭐⭐ 挑战</option>
                </select>
                <label class="toggle-label"><input type="checkbox" id="filter-3d" checked/> 含3D打印</label>
            </div>
        </div>
        <div class="bubble-grid" id="bubble-grid"></div>
    </div>

    <!-- ====== PROJECT SPACE ====== -->
    <div id="project-page" class="page">
        <div class="project-topbar">
            <button class="btn btn-sm" id="back-from-project">← 返回</button>
            <h1 id="project-title">项目加载中...</h1>
            <span id="project-badges"></span>
            <button class="btn btn-sm" id="export-plan-btn">导出</button>
            <button class="btn btn-sm" id="reset-tutor-btn">重置对话</button>
        </div>
        <div class="project-layout">
            <div class="plan-panel" id="plan-panel">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;padding-bottom:0.5rem;border-bottom:1px solid var(--border);">
                    <strong>项目教案</strong>
                    <select id="step-nav" style="padding:4px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;color:var(--text-primary);font-size:0.8rem;outline:none;">
                        <option value="">-- 跳转到步骤 --</option>
                    </select>
                </div>
                <div id="plan-content" class="markdown-body"></div>
            </div>
            <div class="sidebar-panel" id="sidebar-panel">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="tutor">AI助教</button>
                    <button class="sidebar-tab" data-tab="code">代码</button>
                    <button class="sidebar-tab" data-tab="files">文件</button>
                    <button class="sidebar-tab" data-tab="3d" id="tab-3d">3D模型</button>
                    <button class="sidebar-tab" data-tab="collab">协作</button>
                </div>
                <div class="sidebar-content active" id="tab-content-tutor">
                    <div class="chat-messages" id="chat-messages">
                        <div class="chat-msg assistant"><div class="chat-avatar">🤖</div><div class="chat-bubble">你好！我是这个项目的AI助教。<br>在学习过程中有任何问题都可以问我 👋</div></div>
                    </div>
                    <div class="chat-input-area">
                        <textarea id="chat-input" placeholder="输入你的问题..." rows="1"></textarea>
                        <button id="chat-send-btn">发送</button>
                    </div>
                </div>
                <div class="sidebar-content" id="tab-content-code" style="padding:6px;overflow-y:auto;">
                    <div id="code-files-list" style="max-height:50px;overflow-y:auto;margin-bottom:4px;"></div>
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                        <span id="code-filename" style="font-size:0.78rem;color:var(--text-secondary);"></span>
                        <div style="display:flex;gap:3px;">
                            <button class="btn btn-sm btn-primary" id="run-code-btn">运行</button>
                            <button class="btn btn-sm" id="explain-code-btn">解释</button>
                            <button class="btn btn-sm" id="debug-code-btn">调试</button>
                        </div>
                    </div>
                    <textarea id="code-editor" style="display:block;width:100%;height:90px;padding:6px 8px;margin-bottom:4px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--cyan);font-family:Consolas,monospace;font-size:0.78rem;resize:none;outline:none;" placeholder="选择文件或让AI帮你设计代码..."></textarea>
                    <div id="code-output" style="max-height:30px;overflow-y:auto;padding:4px 6px;margin-bottom:6px;background:rgba(0,0,0,0.3);border-radius:4px;font-family:Consolas,monospace;font-size:0.72rem;color:var(--text-secondary);white-space:pre-wrap;min-height:18px;"></div>

                    <div style="border-top:1px solid var(--border);padding-top:6px;margin-bottom:4px;">
                        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                            <strong style="font-size:0.78rem;">💬 代码设计助手</strong>
                            <div style="display:flex;gap:3px;">
                                <button class="btn btn-sm" id="import-code-btn">📥</button>
                                <input type="file" id="code-import-file" accept=".py,.ino,.cpp,.txt,.js" style="display:none;"/>
                                <button class="btn btn-sm" id="code-design-start-btn">新建</button>
                            </div>
                        </div>
                    </div>
                    <div id="code-design-messages" style="max-height:180px;overflow-y:auto;margin-bottom:6px;font-size:0.76rem;line-height:1.45;">
                        <div style="color:var(--text-secondary);text-align:center;padding:0.4rem;">点击「新建」开始让AI帮你设计代码</div>
                    </div>
                    <div style="display:flex;gap:3px;">
                        <input type="text" id="code-design-input" placeholder="描述你想实现的功能..." style="flex:1;padding:5px 7px;background:var(--bg-primary);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:0.78rem;outline:none;"/>
                        <button class="btn btn-sm btn-primary" id="code-design-send-btn">发送</button>
                    </div>
                </div>
                <div class="sidebar-content" id="tab-content-files">
                    <h3 style="font-size:0.9rem;margin-bottom:0.5rem;">项目文件</h3>
                    <div id="project-files-tree" class="file-tree"></div>
                </div>
                <div class="sidebar-content" id="tab-content-3d">
                    <h3 style="font-size:0.9rem;margin-bottom:0.5rem;">3D打印模型</h3>
                    <div id="3d-models-list" class="file-list"></div>
                    <p class="hint-text">STL模型文件请下载后在切片软件中打开打印</p>
                </div>
                <div class="sidebar-content" id="tab-content-collab">
                    <h3 style="font-size:0.9rem;margin-bottom:0.5rem;">团队协作</h3>
                    <div class="collab-setup">
                        <input type="text" id="collab-name-input" placeholder="你的名字" class="collab-input"/>
                        <button class="btn btn-sm" id="collab-create-btn">创建</button>
                        <button class="btn btn-sm" id="collab-join-btn">加入</button>
                    </div>
                    <div id="collab-members" class="collab-members"></div>
                    <div class="collab-chat">
                        <div id="collab-messages" class="collab-msg-list"></div>
                        <div class="collab-input-area">
                            <input type="text" id="collab-msg-input" placeholder="发送消息..." class="collab-input"/>
                            <button class="btn btn-sm" id="collab-send-btn">发送</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ====== KNOWLEDGE STAR MAP ====== -->
    <div id="star-map-page" class="page">
        <div class="page-container" style="max-width:960px;">
            <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:1rem;">
                <div>
                    <h2 style="font-size:1.3rem;font-weight:650;letter-spacing:0.03em;">🌟 我的知识星图</h2>
                    <p style="color:var(--text-secondary);font-size:0.85rem;margin-top:4px;">每完成一个项目，相关知识点就会被点亮</p>
                </div>
                <div style="display:flex;gap:16px;font-size:0.78rem;color:var(--text-secondary);">
                    <span>✨ 已掌握</span>
                    <span>○ 待探索</span>
                </div>
            </div>
            <div class="knowledge-graph" id="knowledge-graph"></div>
        </div>
    </div>

    <!-- ====== ACHIEVEMENT WALL ====== -->
    <div id="achievement-page" class="page">
        <div class="page-container">
            <h2 style="margin-bottom:1rem;">成果展示墙</h2>
            <div class="achievement-grid" id="achievement-grid"></div>
        </div>
    </div>

</div>

<!-- ====== Quiz Modal ====== -->
<div id="quiz-modal" class="quiz-overlay hidden">
    <div class="quiz-dialog">
        <h2>课前小测</h2>
        <p class="quiz-subtitle">先来看看你对这个主题了解多少吧！</p>
        <div id="quiz-questions"></div>
        <div class="quiz-actions">
            <button class="btn btn-primary" id="quiz-start-btn">开始测评</button>
            <button class="btn" id="quiz-skip-btn">跳过</button>
        </div>
        <div class="quiz-result" id="quiz-result"></div>
    </div>
</div>

<!-- ====== Loading ====== -->
<div id="loading-overlay" class="loading-overlay hidden">
    <div class="loading-content">
        <div class="loading-spinner"></div>
        <p id="loading-text">正在加载...</p>
    </div>
</div>

<script src="./js/star-map.js?v=2"></script>
<script src="./js/app.js?v=2"></script>
</body>
</html>
